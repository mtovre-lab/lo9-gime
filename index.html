<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مغير الصوت الاحترافي</title>
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-hover: #5a4bcf;
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent: #fd79a8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: var(--text-color);
    }

    /* Avatar & Lip Sync Animation */
    .avatar-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 25px auto;
      position: relative;
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
    }

    .avatar {
      width: 140px;
      height: 140px;
      background-color: #ffeaa7;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
    }

    .eye {
      width: 18px;
      height: 18px;
      background-color: #2d3436;
      border-radius: 50%;
      position: absolute;
      top: 45px;
    }

    .eye.left { left: 35px; }
    .eye.right { right: 35px; }

    .mouth {
      width: 40px;
      height: 6px;
      background-color: #d63031;
      border-radius: 10px;
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);
      transition: height 0.05s ease, border-radius 0.05s ease;
    }

    /* Controls Section */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .btn-record {
      background-color: #ff7675;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(255, 118, 117, 0.4);
    }

    .btn-record:hover {
      background-color: #d63031;
      transform: translateY(-2px);
    }

    .btn-record.recording {
      animation: pulse 1.5s infinite;
      background-color: #d63031;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(214, 48, 49, 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(214, 48, 49, 0); }
      100% { box-shadow: 0 0 0 0 rgba(214, 48, 49, 0); }
    }

    .btn-play {
      background-color: #00b894;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
    }

    .btn-play:hover:not(:disabled) {
      background-color: #00a884;
      transform: translateY(-2px);
    }

    .btn-play:disabled {
      background-color: #636e72;
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Effects Grid */
    .effects-title {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #a6b0cf;
      text-align: right;
    }

    .effects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .effect-card {
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 12px 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .effect-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .effect-card.active {
      border-color: var(--accent);
      background-color: rgba(253, 121, 168, 0.15);
      box-shadow: 0 0 15px rgba(253, 121, 168, 0.3);
    }

    .effect-card.highlight {
      border-color: #fd79a8;
      background: linear-gradient(145deg, #1e293b, #2d1f3d);
    }

    .effect-icon {
      font-size: 1.6rem;
    }

    .effect-name {
      font-size: 0.9rem;
      font-weight: bold;
    }

    .status-text {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>مغير الصوت المباشر</h1>

    <!-- الشخصية المتحركة -->
    <div class="avatar-container">
      <div class="avatar">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth" id="mouth"></div>
      </div>
    </div>

    <!-- أزرار التسجيل والتشغيل -->
    <div class="controls">
      <button class="btn-record" id="recordBtn">
        <span id="recordIcon">🎙️</span>
        <span id="recordText">بدء التسجيل</span>
      </button>
      <button class="btn-play" id="playBtn" disabled>▶️ تشغيل</button>
    </div>

    <!-- قائمة التأثيرات -->
    <div class="effects-title">اختر التأثير الصوتي:</div>
    <div class="effects-grid">
      
      <div class="effect-card active" data-effect="normal">
        <span class="effect-icon">🎙️</span>
        <span class="effect-name">عادي</span>
      </div>

      <div class="effect-card" data-effect="baby">
        <span class="effect-icon">👶</span>
        <span class="effect-name">صغير</span>
      </div>

      <!-- التأثير الرئيسي المطلوب -->
      <div class="effect-card highlight" data-effect="very_baby">
        <span class="effect-icon">👶⚡</span>
        <span class="effect-name">صغير بزاف</span>
      </div>

      <div class="effect-card" data-effect="robot">
        <span class="effect-icon">🤖</span>
        <span class="effect-name">روبوت</span>
      </div>

      <div class="effect-card" data-effect="alien">
        <span class="effect-icon">👽</span>
        <span class="effect-name">فضائي</span>
      </div>

      <div class="effect-card" data-effect="deep">
        <span class="effect-icon">🐻</span>
        <span class="effect-name">غليظ</span>
      </div>

      <div class="effect-card" data-effect="funny">
        <span class="effect-icon">😂</span>
        <span class="effect-name">مضحك</span>
      </div>

    </div>

    <div class="status-text" id="status">اضغط على "بدء التسجيل" للتحدث من الميكروفون</div>
  </div>

  <script>
    // Variables
    let audioCtx = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let originalAudioBuffer = null;
    let currentSource = null;
    let animFrameId = null;
    let selectedEffect = 'very_baby'; // الافتراضي "صغير بزاف"

    // Elements
    const recordBtn = document.getElementById('recordBtn');
    const recordIcon = document.getElementById('recordIcon');
    const recordText = document.getElementById('recordText');
    const playBtn = document.getElementById('playBtn');
    const mouth = document.getElementById('mouth');
    const statusText = document.getElementById('status');
    const effectCards = document.querySelectorAll('.effect-card');

    // تحديد التأثير الافتراضي في الواجهة
    effectCards.forEach(card => {
      if(card.dataset.effect === selectedEffect) {
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });

    // اختيار التأثير
    effectCards.forEach(card => {
      card.addEventListener('click', () => {
        effectCards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        selectedEffect = card.dataset.effect;
      });
    });

    // إدارة التسجيل
    recordBtn.addEventListener('click', async () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        stopRecording();
      } else {
        startRecording();
      }
    });

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          const arrayBuffer = await audioBlob.arrayBuffer();
          
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          
          originalAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
          playBtn.disabled = false;
          statusText.innerText = "تم تسجيل صوتك بنجاح! اضغط على تشغيل للاستماع بالتأثير.";
        };

        mediaRecorder.start();
        recordBtn.classList.add('recording');
        recordIcon.innerText = "⏹️";
        recordText.innerText = "إيقاف التسجيل";
        statusText.innerText = "جاري تسجيل صوتك الآن...";
        playBtn.disabled = true;

      } catch (err) {
        alert("يرجى السماح بالوصول للميكروفون لتسجيل صوتك.");
        console.error(err);
      }
    }

    function stopRecording() {
      if (mediaRecorder) {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        recordBtn.classList.remove('recording');
        recordIcon.innerText = "🎙️";
        recordText.innerText = "بدء التسجيل";
      }
    }

    // تشغيل الصوت وتطبيق المعالجة
    playBtn.addEventListener('click', () => {
      if (!originalAudioBuffer) return;
      if (currentSource) {
        try { currentSource.stop(); } catch(e){}
      }
      playProcessedAudio(originalAudioBuffer, selectedEffect);
    });

    // معالجة الصوت بـ Web Audio API
    function playProcessedAudio(buffer, effect) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      let source = audioCtx.createBufferSource();
      let analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      // 1. معالجة الـ Pitch والـ Resampling للصوت الحقيقي
      if (effect === 'very_baby') {
        // الـ Pitch العالي والمضحك جداً (2.5x)
        source.buffer = resampleBuffer(buffer, 1.8);
      } else if (effect === 'baby') {
        // صوت صغير عادي (1.4x)
        source.buffer = resampleBuffer(buffer, 1.8);
      } else if (effect === 'deep') {
        // صوت غليظ (0.65x)
        source.buffer = resampleBuffer(buffer, 1.8);
      } else if (effect === 'funny') {
        // تسريع مضحك (1.8x)
        source.buffer = resampleBuffer(buffer, 1.8);
      } else {
        source.buffer = buffer;
      }

      // 2. إعداد السلسلة الصوتية (Audio Nodes Chain)
      let lastNode = source;

      if (effect === 'robot') {
        // فلتر كهرومغناطيسي للروبوت
        let biquad = audioCtx.createBiquadFilter();
        biquad.type = 'peaking';
        biquad.frequency.value = 1000;
        biquad.Q.value = 5;
        biquad.gain.value = 25;
        lastNode.connect(biquad);
        lastNode = biquad;
      } else if (effect === 'alien') {
        // فلتر فضائي حاد
        let biquad = audioCtx.createBiquadFilter();
        biquad.type = 'bandpass';
        biquad.frequency.value = 2200;
        biquad.Q.value = 3;
        lastNode.connect(biquad);
        lastNode = biquad;
      } else if (effect === 'very_baby') {
        // تصفية الفلتر العالي لجعل صوت "صغير بزاف" ناصعاً وواضحاً كرتونياً
        let filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 300;
        lastNode.connect(filter);
        lastNode = filter;
      }

      // ربط المحلل (Analyser) والخرج الصوتي
      lastNode.connect(analyser);
      analyser.connect(audioCtx.destination);

      currentSource = source;
      source.start(0);

      // تشغيل حركة الفم
      animateMouth(analyser);

      source.onended = () => {
        if (animFrameId) cancelAnimationFrame(animFrameId);
        mouth.style.height = '6px';
        mouth.style.borderRadius = '10px';
      };
    }

    // دالة إعادة الـ Sampling برمجياً لرفع/خفظ الـ Pitch بدقة وبدون مكتبات
    function resampleBuffer(inBuffer, pitchFactor) {
      let numChannels = inBuffer.numberOfChannels;
      let oldLength = inBuffer.length;
      let newLength = Math.floor(oldLength / pitchFactor);
      let sampleRate = inBuffer.sampleRate;

      let outBuffer = audioCtx.createBuffer(numChannels, newLength, sampleRate);

      for (let channel = 0; channel < numChannels; channel++) {
        let inputData = inBuffer.getChannelData(channel);
        let outputData = outBuffer.getChannelData(channel);

        for (let i = 0; i < newLength; i++) {
          let pos = i * pitchFactor;
          let index = Math.floor(pos);
          let fraction = pos - index;

          if (index + 1 < oldLength) {
            // Interpolation خطي لتنعيم الصوت الحقيقي والحفاظ على وضوحه
            outputData[i] = inputData[index] * (1 - fraction) + inputData[index + 1] * fraction;
          } else {
            outputData[i] = inputData[index] || 0;
          }
        }
      }
      return outBuffer;
    }

    // تحريك الفم بناءً على AnalyserNode الخاص بالصوت الحقيقي المعالج
    function animateMouth(analyser) {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function draw() {
        animFrameId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArray);

        // حساب معدل شدة الصوت الحالية
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        let average = sum / dataArray.length;

        // تحويل مستوى الصوت إلى ارتفاع للفم
        let mouthHeight = Math.min(Math.max(6, (average / 255) * 45), 40);
        mouth.style.height = `${mouthHeight}px`;
        
        if (mouthHeight > 15) {
          mouth.style.borderRadius = '50%';
        } else {
          mouth.style.borderRadius = '10px';
        }
      }

      draw();
    }
  </script>
</body>
</html>
