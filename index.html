<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة لعبة المافيا - الرئيسية</title>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: rgba(18, 22, 36, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #e63946;
            --primary-glow: rgba(230, 57, 70, 0.4);
            --text-main: #f8f9fa;
            --text-muted: #a0aab2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(230, 57, 70, 0.15), transparent 70%),
                radial-gradient(circle at 10% 90%, rgba(17, 138, 178, 0.1), transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--primary);
            text-shadow: 0 0 20px var(--primary-glow);
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .mode-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .mode-btn:hover {
            background: rgba(230, 57, 70, 0.2);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .mode-btn.primary {
            background: linear-gradient(135deg, #e63946, #b71c1c);
            border: none;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎭 لعبة المافيا</h1>
        <p>اختر طريقة اللعب التي تفضلها مع أصدقائك:</p>

        <!-- زر الانتقال للعب الأوفلاين (بهاتف واحد) -->
        <a href="mafia_offline.html" class="mode-btn primary">
            📱 اللعب المحلي (بدون واي فاي - هاتف واحد)
        </a>

        <!-- زر الانتقال للعب الأونلاين (الموقع الأول) -->
        <a href="mafia_online.html" class="mode-btn">
            🌐 اللعب عبر الإنترنت (أونلاين لكل لاعب جهازه)
        </a>
    </div>

</body>
</html>
